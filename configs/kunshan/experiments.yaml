# Strategy names follow Table 3; controller CLI tokens and model filenames retain compatibility.
suites:
  kunshan-spatial:
  - name: FLORE_w100
    args:
    - evaluate
    - --network
    - kunshan
    - --config
    - configs/kunshan/spatial_scale/flore_w100.yaml
    - --checkpoint
    - models/kunshan_spatial/kunshan_w100_mo.pt
    - --run-id
    - FLORE_w100
  - name: FLORE-TO_w100
    args:
    - evaluate
    - --network
    - kunshan
    - --config
    - configs/kunshan/spatial_scale/flore_to_w100.yaml
    - --checkpoint
    - models/kunshan_spatial/kunshan_w100_to.pt
    - --run-id
    - FLORE-TO_w100
  - name: FLORE-TS_w300
